

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday! ✨</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: linear-gradient(135deg, #0d1b2a, #1b263b, #415a77);
      color: #fff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 50px;
    }

    .container {
      max-width: 450px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
    }

    /* Music Player Container */
    .music-container {
      margin-bottom: 25px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      border-radius: 12px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.05);
    }

    .audio-wrapper {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 15px 20px;
      margin-bottom: 25px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .song-title-label {
      font-size: 1rem;
      font-weight: bold;
      color: #ff758c;
      margin-bottom: 10px;
    }

    audio {
      width: 100%;
      height: 40px;
      border-radius: 10px;
      outline: none;
    }

    /* Photo Slider */
    .slider-container {
      position: relative;
      width: 100%;
      height: 280px;
      border-radius: 20px;
      overflow: hidden;
      margin: 20px 0;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 0.6s ease-in-out;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .slide.active { opacity: 1; }

    .slide img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .slide-caption {
      position: relative;
      z-index: 2;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
      padding: 15px;
      text-align: left;
    }

    .slide-caption h3 { font-size: 1.1rem; color: #ff758c; }
    .slide-caption p { font-size: 0.85rem; color: #ddd; }

    .slider-btns {
      display: flex;
      justify-content: space-between;
      margin-top: -10px;
      margin-bottom: 25px;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 10px 18px;
      border-radius: 14px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    /* Title Styling */
    h1 {
      font-size: 2.2rem;
      background: linear-gradient(45deg, #ff758c, #ff7eb3, #f7d794);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>
<body>

    </div>

      </audio>
