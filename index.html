
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday! ✨</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: linear-gradient(135deg, #0d1b2a, #1b263b, #415a77);
      color: #fff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 50px;
    }

    .container {
      max-width: 450px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
    }

    /* Spotify Embed Wrapper */
    .music-container {
      margin-bottom: 25px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      border-radius: 12px;
      overflow: hidden;
    }

    /* Photo Slider */
    .slider-container {
      position: relative;
      width: 100%;
      height: 280px;
      border-radius: 20px;
      overflow: hidden;
      margin: 20px 0;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 0.6s ease-in-out;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .slide.active { opacity: 1; }

    .slide img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .slide-caption {
      position: relative;
      z-index: 2;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
      padding: 15px;
      text-align: left;
    }

    .slide-caption h3 { font-size: 1.1rem; color: #ff758c; }
    .slide-caption p { font-size: 0.85rem; color: #ddd; }

    .slider-btns {
      display: flex;
      justify-content: space-between;
      margin-top: -10px;
      margin-bottom: 25px;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 10px 18px;
      border-radius: 14px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    /* Title Styling */
    h1 {
      font-size: 2.2rem;
      background: linear-gradient(45deg, #ff758c, #ff7eb3, #f7d794);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>
<body>

    </div>

    <h1>Happy Birthday! 🎂</h1>

    <!-- Photo Slider Gallery -->
    <div class="slider-container">
      
      <!-- Slide 1: image_0.png -->
      <div class="slide active">
        <img src="image_0.png" alt="Her Photo 1">
        <div class="slide-caption">
          <h3>The Birthday Girl! ✨</h3>
          <p>Looking radiant! Happy birthday to you!</p>
        </div>
      </div>

      <!-- Slide 2: image_1.png (Ensure space is removed from repo filename) -->
      <div class="slide">
        <img src="image_1.png" alt="Her Photo 2">
        <div class="slide-caption">
          <h3>Wishing You Joy 🌟</h3>
          <p>Another amazing memory to celebrate.</p>
        </div>
      </div>

      <!-- Slide 3: image_2.png -->
      <div class="slide">
        <img src="image_2.png" alt="Her Photo 3">
        <div class="slide-caption">
          <h3>To Many More! 🎉</h3>
          <p>May this new year be your best one yet!</p>
        </div>
      </div>
